server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3364}/${MYSQL_DATABASE:script_kill_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:script_user}
    password: ${MYSQL_PASSWORD:script123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6437}
      password: ${REDIS_PASSWORD:redis123}
      timeout: 6000ms

logging:
  level:
    com.example.scriptkill: DEBUG
    org.hibernate.SQL: DEBUG